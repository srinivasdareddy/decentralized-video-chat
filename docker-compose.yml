# Run Zipcall with Docker Compose.
#
#   docker compose up -d
#     The app on http://localhost:3000 (this machine only).
#
#   DOMAIN=call.example.com docker compose --profile https up -d
#     Also starts Caddy, which serves the app over HTTPS with an automatic
#     certificate. Point the domain's DNS at this machine and open ports 80
#     and 443 first.
#
#   docker compose --profile https --profile turn up -d
#     Also starts a TURN relay (coturn) for callers behind strict firewalls.
#     Needs TURN_SECRET, TURN_URLS and, on most cloud servers,
#     TURN_EXTERNAL_IP in .env; open UDP/TCP 3478 and UDP 49152-65535
#     (or the TURN_MIN_PORT-TURN_MAX_PORT range you set).
#
# Settings come from .env; see .env.template.
name: zipcall

services:
  app:
    build:
      context: .
      args:
        # e.g. REVISION=$(git rev-parse --short HEAD) docker compose build
        REVISION: ${REVISION:-}
    image: zipcall
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      # Caddy (the https profile) is one proxy in front of the app; trusting
      # it gives the app each visitor's real IP address for rate limiting.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      # Browsers only allow camera access over HTTPS or on localhost, so by
      # default the app is reachable from this machine only. Use the https
      # profile, or your own reverse proxy, to serve it to others.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    logging:
      driver: local

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local

  turn:
    image: coturn/coturn:4.7
    profiles: [turn]
    restart: unless-stopped
    # TURN relays use a range of UDP ports; host networking avoids mapping
    # each one and preserves the addresses coturn sees.
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-zipcall}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      # Each relayed call uses a few ports from this range (one per browser
      # and TURN URL), so it bounds how many calls can be relayed at once.
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49152}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-65535}
    # Refuses to start without a secret: an empty one would let anyone
    # mint credentials and use the relay.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#TURN_SECRET}" -lt 16 ]; then
          echo "Set TURN_SECRET (16+ characters) in .env to use the turn profile." >&2
          exit 1
        fi
        exec turnserver \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --realm="$$TURN_REALM" \
          $${TURN_EXTERNAL_IP:+--external-ip="$$TURN_EXTERNAL_IP"} \
          --listening-port=3478 --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          --fingerprint --no-cli --no-tls --no-dtls --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --log-file=stdout --simple-log
    logging:
      driver: local

volumes:
  caddy-data:
  caddy-config:
